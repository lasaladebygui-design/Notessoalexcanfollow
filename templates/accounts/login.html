{% extends "base.html" %}
{% block title %}Entrar · Notas{% endblock %}
{% block guest_content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <h1 class="font-display text-2xl font-bold text-center mb-6">Notas<span class="text-accent">.</span></h1>
        <form method="post" class="card-panel space-y-4">
            {% csrf_token %}
            {% if form.errors %}<p class="field-error">Usuario o contraseña incorrectos.</p>{% endif %}
            {% for field in form %}
            <div>
                <label class="block text-xs font-medium text-ink-secondary mb-1.5">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <button type="submit" class="btn-primary w-full">Entrar</button>
        </form>
        <p class="text-center text-sm text-ink-muted mt-4">¿No tienes cuenta? <a href="{% url 'accounts:signup' %}" class="text-accent">Regístrate</a></p>
    </div>
</div>
{% endblock %}
